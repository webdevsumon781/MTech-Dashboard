<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Example</title>
  <style>
    body {
      background-color: #0d0d1a;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .form-container {
      display: flex;
      gap: 10px;
      background-color: #1a1a2e;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .form-container input,
    .form-container select,
    .form-container button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #262640;
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    .form-container input::placeholder {
      color: #999;
    }

    .form-container button {
      background-color: #1e90ff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-container button:hover {
      background-color: #1c7ed6;
    }
  </style>
</head>
<body>

  <form class="form-container" id="reportForm">
    <input type="text" placeholder="Report Title" id="reportTitle" required>
    <select id="scanSelect" required>
      <option value="">Select Scan</option>
      <option value="scan1">Scan 1</option>
      <option value="scan2">Scan 2</option>
    </select>
    <select id="formatSelect" required>
      <option value="">Format</option>
      <option value="pdf">PDF</option>
      <option value="html">HTML Report</option>
      <option value="doc">Word Document Report</option>
    </select>
    <button type="submit">Generate</button>
  </form>

  

  <script>
    const form = document.getElementById('reportForm');

    form.addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent form submission

      const title = document.getElementById('reportTitle').value;
      const scan = document.getElementById('scanSelect').value;
      const format = document.getElementById('formatSelect').value;

      if (title && scan && format) {
        let content = `
          <h1>Report Title: ${title}</h1>
          <p>Scan: ${scan}</p>
          <p>Format: ${format}</p>
        `;
        
        if (format === 'pdf') {
          // Simulate PDF download with structured content
          const blob = new Blob([content], { type: 'application/pdf' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${title}.pdf`;
          link.click();
        } else if (format === 'html') {
          // Simulate HTML download
          const blob = new Blob([content], { type: 'text/html' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${title}.html`;
          link.click();
        }else if (format === 'doc') {
          // Simulate HTML download
          const blob = new Blob([content], { type: 'text/doc' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${title}.doc`;
          link.click();
        }
      } else {
        alert('Please fill in all fields.');
      }
    });
  </script>
